# Routed by Coolify's Traefik (behind the Cloudflare Tunnel) over the Docker network, so the
# port is only exposed, never published. Set the domain in Coolify as http://<sub>.coding36.com:<PORT>.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=${PORT:?set PORT}
    expose:
      - '${PORT}'
