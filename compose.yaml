services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # The _9203 suffix tells Coolify (Traefik) which container port to route
      # the generated domain to. Keep it in sync with PORT and expose below.
      # Override the domain in the Coolify UI (Domains) if needed.
      - SERVICE_FQDN_APP_9203
      - PORT=9203
    expose:
      - "9203"
